name: 定时抓取国考数据并更新看板

# 仅定时与手动触发；不监听 push，避免提交后循环触发
on:
  schedule:
    # UTC 每 2 小时的 23 分（北京时间 0:23 / 2:23 / …，覆盖全天发布时点；
    # GitHub 定时任务高峰期可能延迟数分钟至数十分钟，属正常）
    - cron: '23 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-guokao
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml html5lib openpyxl

      - name: 抓取 2027 国考报名数据（中公全国汇总 + 华图市县 + 我的条件职位池）
        run: python scrape_2027.py
        env:
          # 中公系域名对云端 IP 返回 403，脚本会自动跳过并沿用上一快照，仅更新可访问的华图数据
          PYTHONIOENCODING: utf-8

      - name: 抓取职位排行数据（失败不阻断主看板更新）
        continue-on-error: true
        run: python scrape_bmrs.py

      # 主看板始终与根入口 index.html 保持一致
      - name: 同步根入口
        run: cp -f "2027国考报名实时看板.html" index.html

      - name: 有新数据则提交并推送（Pages 自动重建）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -X theirs origin main || true
          # 历史快照只保留最新一份，避免定时任务撑大仓库（最新快照仍可供下次兜底）
          ls -t data/bmrs27/snap_*.json 2>/dev/null | tail -n +2 | xargs -r rm -f
          ls -t data/bmrs/*.json.gz 2>/dev/null | tail -n +2 | xargs -r rm -f
          git add -A
          if git diff --cached --quiet; then
            echo "数据源暂无新内容，本次跳过提交"
          else
            git commit -m "自动更新：$(date -u +'%Y-%m-%d %H:%M UTC') 云端抓取"
            for i in 1 2 3; do
              if git push; then break; fi
              git pull --rebase -X theirs origin main
              sleep 5
            done
          fi
